; T020 release presets. Build with tools/build_release.sh (needs the official Godot 4.7.2
; export templates; see README "发布构建"). Content JSON is included explicitly because the game
; reads content packs as data files, not as imported resources. Tests, tools and docs stay out.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="content/*.json"
exclude_filter="tests/*, tools/*, docs/*, *.md"
export_path="build/linux/EverydayCity.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="content/*.json"
exclude_filter="tests/*, tools/*, docs/*, *.md"
export_path="build/windows/EverydayCity.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/modify_resources=false
application/product_name="Everyday City"
application/file_description="Everyday City"
